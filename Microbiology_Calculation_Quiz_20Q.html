<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Microbiology Calculation Quiz 20Q</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Segoe UI",sans-serif;background:linear-gradient(135deg,#edf8ff,#f7efff,#fff5e8);color:#263650}
header{padding:24px;text-align:center;color:#fff;background:linear-gradient(120deg,#15245e,#694bbd,#b44991)}h1{margin:0;font-size:clamp(25px,4vw,40px)}header p{color:#ffe58d;font-weight:700}
.wrap{max-width:980px;margin:auto;padding:18px}.stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:10px}.pill{background:#fff;border-radius:99px;padding:8px 14px;font-weight:800;box-shadow:0 2px 8px #0001}
.barbg{height:11px;background:#dfe6f1;border-radius:99px;overflow:hidden;margin-bottom:14px}.bar{height:100%;width:0;background:linear-gradient(90deg,#43b8d1,#7257d9,#df5b9d);transition:.3s}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 7px 25px #20345a18}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.topic{background:#eef2ff;color:#4d50a5;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:900}.num{font-weight:900;color:#6c7789}
.visual{height:135px;border-radius:16px;background:linear-gradient(135deg,#eff8ff,#fff1f7);display:flex;align-items:center;justify-content:center;font-size:55px;font-weight:900;color:#604fb3;margin:12px 0}.question{font-size:19px;line-height:1.5;font-weight:800;margin:14px 0}
.options{display:grid;gap:9px}.option{border:2px solid #dfe5ef;background:#fbfcff;border-radius:12px;padding:12px;text-align:left;font-weight:700;cursor:pointer}.option:hover{border-color:#7257d9;background:#f8f5ff}.correct{border-color:#52a56e!important;background:#edf8f0!important}.wrong{border-color:#d75d6a!important;background:#fff0f2!important}
input{width:100%;padding:13px;font-size:18px;border:2px solid #dfe5ef;border-radius:12px}.actions{margin-top:12px}.btn{border:0;border-radius:11px;padding:11px 16px;background:#7257d9;color:white;font-weight:900;cursor:pointer}.feedback{margin-top:14px;background:#f5f7fb;border-radius:12px;padding:13px;line-height:1.55}.solution{margin-top:9px;padding:10px;background:#f8f5ff;border-left:4px solid #7257d9;border-radius:8px}.final{text-align:center;padding:30px}.big{font-size:52px;font-weight:950;color:#7257d9}
</style></head><body>
<header><h1>🧪 MICROBIOLOGY CALCULATION QUIZ</h1><p>20 Questions • Culture Media • Dilution • OD600 • Molecular Biology</p></header>
<div class="wrap"><div class="stats"><span class="pill">⭐ Score: <b id="score">0</b></span><span class="pill">📘 Question: <b id="qn">1</b>/20</span><span class="pill">🎯 Correct: <b id="correct">0</b></span><span class="pill">⏱️ <b id="time">00:00</b></span></div>
<div class="barbg"><div class="bar" id="bar"></div></div><div id="stage"></div></div>
<script>
const Q=[["Culture medium", "choice", "🧫", "ผงอาหาร 23 g/L ต้องการ 250 mL ใช้กี่กรัม?", ["2.30 g", "5.75 g", "9.20 g", "23.00 g"], 1, "23 × 0.25 = 5.75 g"], ["% (w/v)", "input", "🧪", "เตรียม glucose 10% (w/v) 500 mL ใช้ glucose กี่กรัม?", 50, "10 × 500 / 100 = 50 g"], ["Molarity", "choice", "🧂", "เตรียม NaCl 0.50 M 250 mL, MW 58.44 g/mol ใช้กี่กรัม?", ["2.92 g", "5.84 g", "7.31 g", "14.61 g"], 2, "0.50 × 0.250 × 58.44 = 7.31 g"], ["OD600 dilution", "choice", "🧪→🧪", "culture 1 mL + medium 3 mL วัด OD600 = 0.25 ค่าเดิมเท่าใด?", ["0.0625", "0.25", "0.75", "1.00"], 3, "DF = 4/1 = 4; ODเดิม = 0.25 × 4 = 1.00"], ["Final concentration", "input", "🍬", "glucose stock 20% ใช้ 5 mL ปรับสุดท้าย 100 mL ความเข้มข้นสุดท้ายกี่ %?", 1, "20 × 5 / 100 = 1.0%"], ["Serial dilution", "choice", "🧪🧪🧪", "ทำ 10-fold dilution จำนวน 5 ครั้ง dilution สุดท้ายเท่าใด?", ["10⁻³", "10⁻⁴", "10⁻⁵", "10⁻⁶"], 2, "(10⁻¹)⁵ = 10⁻⁵"], ["Unit conversion", "choice", "🧬", "DNA 250 ng/µL เท่ากับกี่ µg/mL?", ["0.25", "2.5", "25", "250"], 3, "1 ng/µL = 1 µg/mL ดังนั้น = 250 µg/mL"], ["PCR final concentration", "choice", "🧬+🧪", "PCR 25 µL เติม 10× buffer 2.5 µL ความเข้มข้นสุดท้ายเท่าใด?", ["0.1×", "1.0×", "2.5×", "10×"], 1, "10 × 2.5 / 25 = 1.0×"], ["Agarose gel", "input", "▰▰▰", "agarose gel 1.5% (w/v) 60 mL ใช้ agarose กี่กรัม?", 0.9, "1.5 × 60 / 100 = 0.90 g"], ["CFU/mL", "choice", "🧫•••", "เจือจาง 10⁻⁴ หยอด 0.1 mL พบ 72 colonies ความเข้มข้นเริ่มต้นเท่าใด?", ["7.2 × 10⁴", "7.2 × 10⁵", "7.2 × 10⁶", "7.2 × 10⁷"], 2, "72 ÷ (10⁻⁴ × 0.1) = 7.2 × 10⁶ CFU/mL"], ["Molarity", "input", "⚗️", "Tris-HCl 0.10 M 500 mL, MW 157.60 g/mol ใช้กี่กรัม?", 7.88, "0.10 × 0.500 × 157.60 = 7.88 g"], ["NaCl %", "choice", "🧂+💧", "NaCl 0.85% (w/v) 200 mL ใช้กี่กรัม?", ["0.85 g", "1.00 g", "1.70 g", "8.50 g"], 2, "0.85 × 200 / 100 = 1.70 g"], ["Dilution factor", "input", "2 mL + 8 mL", "ตัวอย่าง 2 mL + diluent 8 mL dilution factor เท่าใด?", 5, "DF = 10 / 2 = 5"], ["OD600 total", "choice", "OD₆₀₀=0.25", "1 mL culture + 3 mL medium วัด OD600 = 0.25 ค่า OD ของตัวอย่างเดิมเท่าใด?", ["0.25", "0.50", "0.75", "1.00"], 3, "DF = 4; original OD = 0.25 × 4 = 1.00"], ["Buffer preparation", "input", "1.0 M → 0.20 M", "เตรียม buffer 0.20 M 250 mL จาก stock 1.0 M ใช้ stock กี่ mL?", 50, "V₁ = C₂V₂/C₁ = 0.20 × 250 / 1.0 = 50 mL"], ["Molecular biology", "choice", "🧬", "primer 100 µM ทำ working 10 µM ปริมาตร 500 µL ใช้ stock กี่ µL?", ["5", "25", "50", "100"], 2, "V₁ = 10 × 500 / 100 = 50 µL"], ["Unit conversion", "choice", "0.75 mL", "0.75 mL เท่ากับกี่ µL?", ["7.5", "75", "750", "7,500"], 2, "0.75 × 1,000 = 750 µL"], ["Final concentration", "input", "70% → ?", "ethanol 70% ใช้ 20 mL ปรับสุดท้าย 100 mL ความเข้มข้นสุดท้ายกี่ %?", 14, "70 × 20 / 100 = 14%"], ["Culture medium", "choice", "🧫+AGAR", "agar 1.5% (w/v) ปริมาตร 200 mL ต้องใช้กี่กรัม?", ["1.5", "2.0", "3.0", "15"], 2, "1.5 × 200 / 100 = 3.0 g"]];let i=0,score=0,correct=0,answered=false,start=Date.now();setInterval(()=>{let s=Math.floor((Date.now()-start)/1000);document.getElementById('time').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
function render(){answered=false;let q=Q[i],v=q[2],h=`<div class="card"><div class="top"><span class="topic">${q[0]}</span><span class="num">ข้อ ${i+1}</span></div><div class="visual">${v}</div><div class="question">${q[3]}</div>`;
if(q[1]==='choice'){h+='<div class="options">';q[4].forEach((x,k)=>h+=`<button class="option" onclick="choose(this,${k})">${String.fromCharCode(65+k)}. ${x}</button>`);h+='</div>'}else h+=`<input id="ans" inputmode="decimal" placeholder="พิมพ์เฉพาะตัวเลข"><div class="actions"><button class="btn" onclick="submit()">ตรวจคำตอบ</button></div>`;
h+=`<div id="fb" style="display:none"></div></div>`;document.getElementById('stage').innerHTML=h;document.getElementById('qn').textContent=i+1;document.getElementById('bar').style.width=(i/Q.length*100)+'%'}
function finish(ok){if(answered)return;answered=true;if(ok){score+=10;correct++}else score=Math.max(0,score-2);document.getElementById('score').textContent=score;document.getElementById('correct').textContent=correct;let fb=document.getElementById('fb'),q=Q[i];fb.style.display='block';fb.innerHTML=(ok?'✅ <b>ถูกต้อง!</b> +10 คะแนน':'❌ <b>ยังไม่ถูกต้อง</b> −2 คะแนน')+`<div class="solution"><b>วิธีคิด:</b> ${q[q.length-1]}</div><div class="actions"><button class="btn" onclick="next()">${i===Q.length-1?'ดูผลคะแนน':'ข้อถัดไป →'}</button></div>`}
function choose(b,k){let q=Q[i];document.querySelectorAll('.option').forEach(x=>x.disabled=true);document.querySelectorAll('.option')[q[5]].classList.add('correct');if(k!==q[5])b.classList.add('wrong');finish(k===q[5])}
function submit(){let q=Q[i],x=document.getElementById('ans').value.trim().replace(',','.');if(!x)return;document.getElementById('ans').disabled=true;finish(Math.abs(Number(x)-q[4])<=0.01)}
function next(){if(i===Q.length-1)final();else{i++;render()}}
function final(){document.getElementById('bar').style.width='100%';document.getElementById('stage').innerHTML=`<div class="card final"><div class="big">🏆 ${score}</div><h2>Quiz Complete!</h2><p>ตอบถูก ${correct} จาก 20 ข้อ</p><p>${score>=180?'ยอดเยี่ยมมาก!':score>=140?'ทำได้ดีมาก!':'ลองทำอีกครั้งเพื่อทบทวนสูตร'}</p><button class="btn" onclick="location.reload()">เล่นใหม่</button></div>`}
render();
</script></body></html>
